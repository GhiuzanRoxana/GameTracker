<nav class="navbar">
  <div class="nav-container">
    <div class="logo">
      <a routerLink="/">🎮 GameTracker</a>
    </div>

    <div class="search-bar">
      <input 
        type="text" 
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        placeholder="Search games...">
      <button (click)="onSearch()">Search</button>
    </div>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/browse" routerLinkActive="active">Browse</a>
      <a routerLink="/favorites" routerLinkActive="active">Favorites</a>

      <ng-container *ngIf="auth.isLoggedIn(); else loggedOut">
        <a routerLink="/user" routerLinkActive="active" class="user-link">Hi, {{ auth.getUser()?.username }}</a>
        <a (click)="logout()" class="logout-link">Logout</a>
      </ng-container>

      <ng-template #loggedOut>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </ng-template>
    </div>
  </div>
</nav>
